name: Update Language Statistics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run language metrics tool
        uses: ./
        with:
          github_token: ${{ secrets.STATS_TOKEN }}
          visualization_types: "pie"
          output_path: "stats"
          dark_mode: "true"
          exclude_languages: "Astro"
      
      - name: Fix Docker Root Permissions Bug
        run: |
          sudo chown -R $USER:$USER .git
          sudo chmod -R 777 .git

      - name: Commit and push generated images
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add stats/
          git commit -m "Update language statistics cake diagram" || exit 0
          git push
