name: Update Language Statistics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jstrieb/github-stats-extended@v1
        with:
          github_token: ${{ secrets.STATS_TOKEN }}
          visualization_types: "leaderboard pie"
          output_path: "stats"
